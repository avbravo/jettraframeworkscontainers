<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JettraStudio Application</title>
</head>
<body>
  <header class="jettra-base-header" style="display:flex; justify-content:space-between; align-items:center; padding:12px 24px; border-bottom:2px solid var(--jf-accent, #ffd700); background:var(--jf-surface, #0e1220);">
    <div style="font-weight:900; font-size:1.35rem; color:var(--jf-accent, #ffd700); letter-spacing:0.08em; text-transform:uppercase;">
      🎨 JettraStudio
    </div>
    <div style="display:flex; gap:16px; align-items:center;">
      <jettras:theme-selector/>
    </div>
  </header>
  <main class="jettra-base-main" style="padding:24px; min-height:calc(100vh - 120px); box-sizing:border-box;">
    <jettras:child/>
  </main>
  <footer class="jettra-base-footer" style="text-align:center; padding:16px; font-size:0.85rem; color:var(--jf-text-secondary, #94a3b8); border-top:1px solid var(--jf-border, rgba(0,212,255,0.3)); background:var(--jf-surface, #0e1220);">
    JettraStudio &copy; 2026 &mdash; Ecosistema Jettra (Java 25+)
  </footer>
</body>
</html>
